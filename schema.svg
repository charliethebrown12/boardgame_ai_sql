<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1050" viewBox="0 0 1260 1050" role="img" aria-labelledby="title desc">
<title id="title">Board Game Collection database schema</title><desc id="desc">Database schema for users, games, publishers, designers, genres, collections, ratings, and play sessions. Primary and foreign keys are labeled.</desc>
<style>.bg{fill:#f6f8fb}.card{fill:#fff;stroke:#26364a;stroke-width:2;rx:12}.head{fill:#dcecff;rx:12}.title{font:700 18px sans-serif;fill:#17283b}.body{font:14px ui-monospace,monospace;fill:#27384c}.key{font-weight:700;fill:#125f9a}.note{font:14px sans-serif;fill:#40556b}</style>
<rect class="bg" width="1260" height="1050"/><text x="630" y="42" text-anchor="middle" class="title" style="font-size:25px">Board Game Collection — Database Schema</text>
<text x="630" y="70" text-anchor="middle" class="note">Foreign key references are written inside each table; bridge tables connect many-to-many relationships.</text>
<!-- row 1 -->
<g transform="translate(55 110)"><rect class="card" width="355" height="150"/><rect class="head" width="355" height="36"/><text class="title" x="15" y="24">users</text><text class="body" x="15" y="63">PK user_id</text><text class="body" x="15" y="88">username TEXT UNIQUE</text><text class="body" x="15" y="113">city TEXT</text></g>
<g transform="translate(452 110)"><rect class="card" width="355" height="175"/><rect class="head" width="355" height="36"/><text class="title" x="15" y="24">games</text><text class="body" x="15" y="62">PK game_id</text><text class="body" x="15" y="86">title, year_published</text><text class="body" x="15" y="110">min_players, max_players</text><text class="body" x="15" y="134">play_time_minutes, complexity</text><text class="body" x="15" y="158">FK publisher_id → publishers</text></g>
<g transform="translate(849 110)"><rect class="card" width="355" height="150"/><rect class="head" width="355" height="36"/><text class="title" x="15" y="24">publishers</text><text class="body" x="15" y="63">PK publisher_id</text><text class="body" x="15" y="88">name TEXT UNIQUE</text><text class="body" x="15" y="113">country TEXT</text></g>
<!-- row 2 -->
<g transform="translate(55 325)"><rect class="card" width="355" height="150"/><rect class="head" width="355" height="36"/><text class="title" x="15" y="24">designers</text><text class="body" x="15" y="63">PK designer_id</text><text class="body" x="15" y="88">name TEXT UNIQUE</text></g>
<g transform="translate(452 325)"><rect class="card" width="355" height="150"/><rect class="head" width="355" height="36"/><text class="title" x="15" y="24">game_designers</text><text class="body" x="15" y="63">PK, FK game_id → games</text><text class="body" x="15" y="88">PK, FK designer_id → designers</text><text class="body" x="15" y="113">Composite primary key</text></g>
<g transform="translate(849 325)"><rect class="card" width="355" height="150"/><rect class="head" width="355" height="36"/><text class="title" x="15" y="24">genres</text><text class="body" x="15" y="63">PK genre_id</text><text class="body" x="15" y="88">name TEXT UNIQUE</text></g>
<!-- row 3 -->
<g transform="translate(55 540)"><rect class="card" width="355" height="150"/><rect class="head" width="355" height="36"/><text class="title" x="15" y="24">game_genres</text><text class="body" x="15" y="63">PK, FK game_id → games</text><text class="body" x="15" y="88">PK, FK genre_id → genres</text><text class="body" x="15" y="113">Composite primary key</text></g>
<g transform="translate(452 540)"><rect class="card" width="355" height="175"/><rect class="head" width="355" height="36"/><text class="title" x="15" y="24">collections</text><text class="body" x="15" y="63">PK, FK user_id → users</text><text class="body" x="15" y="87">PK, FK game_id → games</text><text class="body" x="15" y="111">owned_since INTEGER</text><text class="body" x="15" y="135">condition: new / good / worn</text><text class="body" x="15" y="159">Composite primary key</text></g>
<g transform="translate(849 540)"><rect class="card" width="355" height="175"/><rect class="head" width="355" height="36"/><text class="title" x="15" y="24">ratings</text><text class="body" x="15" y="63">PK, FK user_id → users</text><text class="body" x="15" y="87">PK, FK game_id → games</text><text class="body" x="15" y="111">rating REAL (1–10)</text><text class="body" x="15" y="135">rated_on TEXT</text><text class="body" x="15" y="159">Composite primary key</text></g>
<!-- row 4 -->
<g transform="translate(452 780)"><rect class="card" width="355" height="200"/><rect class="head" width="355" height="36"/><text class="title" x="15" y="24">play_sessions</text><text class="body" x="15" y="63">PK session_id</text><text class="body" x="15" y="87">FK user_id → users</text><text class="body" x="15" y="111">FK game_id → games</text><text class="body" x="15" y="135">played_on, player_count</text><text class="body" x="15" y="159">duration_minutes, notes</text></g>
<text x="630" y="1020" text-anchor="middle" class="note">PK = primary key · FK = foreign key · Games, designers, and publishers are real; community data is fictional.</text>
</svg>
